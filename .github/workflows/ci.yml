name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrswi
          POSTGRES_PASSWORD: hrswi
          POSTGRES_DB: hrswi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrswi" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      HRSWI_TEST_DATABASE_URL: postgresql+psycopg://hrswi:hrswi@localhost:5432/hrswi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Migration check (no model drift)
        run: |
          alembic -x url=$HRSWI_TEST_DATABASE_URL upgrade head
          alembic check
        env:
          HRSWI_DATABASE_URL: ${{ env.HRSWI_TEST_DATABASE_URL }}
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
