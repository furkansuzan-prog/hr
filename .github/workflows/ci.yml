name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # weekly perf smoke + backup/restore drill (Monday 03:17 UTC)
  workflow_dispatch:
    inputs:
      employees:
        description: "Synthetic employees to seed for the perf smoke"
        default: "1200"
      concurrency:
        description: "Closed-loop virtual users (no think time)"
        default: "20"
      requests:
        description: "Requests per pass"
        default: "300"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrswi
          POSTGRES_PASSWORD: hrswi
          POSTGRES_DB: hrswi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrswi" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      HRSWI_TEST_DATABASE_URL: postgresql+psycopg://hrswi:hrswi@localhost:5432/hrswi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Migration check (no model drift)
        run: |
          alembic -x url=$HRSWI_TEST_DATABASE_URL upgrade head
          alembic check
        env:
          HRSWI_DATABASE_URL: ${{ env.HRSWI_TEST_DATABASE_URL }}
      - run: pytest -q  # includes tests/test_metrics.py (B-05 /metrics)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  # Scheduled / manual only. Publishes numbers as an artifact; NO assertions on absolute latency (shared runners
  # are noisy). Fails only on functional problems (API not starting, seeding, backup/restore verification).
  perf-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrswi
          POSTGRES_PASSWORD: hrswi
          POSTGRES_DB: hrswi_perf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrswi" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      HRSWI_DATABASE_URL: postgresql+psycopg://hrswi:hrswi@localhost:5432/hrswi_perf
      HRSWI_REDIS_URL: redis://localhost:6379/0
      EMPLOYEES: ${{ github.event.inputs.employees || '1200' }}
      CONCURRENCY: ${{ github.event.inputs.concurrency || '20' }}
      REQUESTS: ${{ github.event.inputs.requests || '300' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core postgresql-client
      - run: pip install -r requirements-dev.txt
      - name: Migrate and seed
        run: |
          set -o pipefail
          mkdir -p perf-out
          alembic upgrade head
          { time python -m app.seed.synthetic --employees "$EMPLOYEES" > perf-out/seed.txt; } 2> perf-out/seed_time.txt
          tail -3 perf-out/seed.txt perf-out/seed_time.txt
      - name: Start API (2 workers)
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2 > perf-out/api.log 2>&1 &
          for i in $(seq 60); do curl -sf localhost:8000/health/ready && break; sleep 1; done
          curl -sf localhost:8000/health/ready
      - name: Perf smoke (cold, warm, think-time)
        run: |
          set -o pipefail
          redis-cli -h localhost flushdb
          python scripts/perf_smoke.py --base http://localhost:8000 --concurrency "$CONCURRENCY" --requests "$REQUESTS" \
            --seed 1 --label cold --json perf-out/cold.json | tee perf-out/cold.txt
          python scripts/perf_smoke.py --base http://localhost:8000 --concurrency "$CONCURRENCY" --requests "$REQUESTS" \
            --seed 2 --label warm --json perf-out/warm.json | tee perf-out/warm.txt
          python scripts/perf_smoke.py --base http://localhost:8000 --concurrency 50 --think-time 2 --duration 60 \
            --requests 0 --seed 3 --label think --json perf-out/think.json | tee perf-out/think.txt
          curl -s localhost:8000/metrics > perf-out/metrics.txt
      - name: Backup / restore drill
        run: |
          set -o pipefail
          scripts/backup.sh --url "$HRSWI_DATABASE_URL" --dir perf-out/backups | tee perf-out/backup.txt
          scripts/restore_verify.sh perf-out/backups/*.dump --url "$HRSWI_DATABASE_URL" --live | tee perf-out/restore.txt
          rm -f perf-out/backups/*.dump
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-smoke-${{ github.run_id }}
          path: backend/perf-out/
